name: Publicar maqueta en GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  verificar-y-construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Comprobar HTML y probar SQLite
        run: |
          python3 build.py --check
          npm test
      - name: Construir sitio autocontenido
        run: python3 build.py
      - name: Subir sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: verificar-y-construir
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
